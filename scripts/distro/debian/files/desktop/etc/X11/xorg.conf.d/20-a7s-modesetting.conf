# a7s-build: modesetting draws with glamor on the GPU. The display device has
# no OpenGL driver of its own; Mesa's kmsro driver for it renders through zink
# on the PowerVR Vulkan driver. That driver only starts with
# PVR_I_WANT_A_BROKEN_VULKAN_DRIVER=1, which LightDM's X server gets from
# /usr/libexec/a7s-xserver (/etc/lightdm/lightdm.conf.d/50-a7s-xserver.conf).
Section "Device"
    Identifier "a7s-modesetting"
    Driver     "modesetting"
    Option     "AccelMethod" "glamor"
EndSection
