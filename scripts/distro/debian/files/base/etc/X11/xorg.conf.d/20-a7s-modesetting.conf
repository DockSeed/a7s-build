# a7s-build: modesetting without glamor. glamor on zink/PowerVR makes every
# software-rendered frame a GPU upload (68 % of video frames dropped with it,
# 0.3 % without). The X session runs without GPU acceleration.
Section "Device"
    Identifier "a7s-modesetting"
    Driver     "modesetting"
    Option     "AccelMethod" "none"
EndSection
