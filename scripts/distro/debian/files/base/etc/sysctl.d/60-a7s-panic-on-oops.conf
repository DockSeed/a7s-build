# a7s-build: a kernel oops ends in a panic, and the panic reboots the board
# after the kernel's panic timeout. Without this, a kernel that oopsed keeps
# running half broken and nothing resets the board, so the boot chain's boot
# counter never counts on and never reaches safe mode (docs/image.md,
# "Safe mode"). The lockup detectors already panic (kernel configuration).
# To keep a kernel running after an oops, set kernel.panic_on_oops = 0 in a
# file that sorts after this one, such as /etc/sysctl.d/90-local.conf.
kernel.panic_on_oops = 1
