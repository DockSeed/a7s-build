# a7s-build: no login over SSH until the account has a password.
# The image ships the user account with an EMPTY password that must be changed
# at the first login on the console (docs/image.md, "First login"). sshd must
# never accept that empty password: PermitEmptyPasswords is also OpenSSH's
# default, it is written here so a changed default cannot open it. root is
# locked in the image and logs in with a key only, as on any Debian system.
PermitEmptyPasswords no
PermitRootLogin prohibit-password
