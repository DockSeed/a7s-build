# a7s-build: PID 1 feeds the SoC watchdog (WDT_CPUS), which U-Boot hands to the
# kernel running and which counts at most 16 s. A hung userspace resets the
# board; watchdog.open_timeout=60 on the kernel command line covers the time
# before PID 1 opens the device.
[Manager]
RuntimeWatchdogSec=16s
RebootWatchdogSec=16s
