# SPDX-License-Identifier: GPL-2.0-only OR MIT
#
# User-facing switches of the a7s-build recipe and their defaults.
#
# Every switch is an environment variable with the prefix A7S_. Set it in the
# environment of ./build.sh to override the default, e.g.
#
#   A7S_DESKTOP=1 ./build.sh
#
# Format (./build.sh --help reads this file): a block of comment lines directly
# above a line of the form  A7S_NAME="${A7S_NAME:-default}"  documents that
# switch. Switches in the "host" section are read by ./build.sh on the host and
# never reach the container; all other A7S_* switches listed here are passed into
# the build container when they are set, and nothing else is.
#
# This file is sourced by bash inside the container (scripts/lib/common.sh), so
# it must stay plain variable assignments.

# --- host -------------------------------------------------------------------

# Container engine: podman or docker. Empty: podman if installed, else docker.
A7S_ENGINE="${A7S_ENGINE:-}"

# Scratch directory on the host (kernel tree, rootfs, ...). Relative paths are
# relative to the repository. Needs tens of GB; see docs/building.md.
A7S_WORK="${A7S_WORK:-work}"

# Artefact directory on the host (boot chain, kernel packages, the image).
A7S_OUT="${A7S_OUT:-out}"

# Download cache on the host. Every file in it is addressed by its sha256 and
# verified again on every use, so it can be shared between checkouts.
A7S_CACHE="${A7S_CACHE:-cache}"

# --- image content ----------------------------------------------------------

# Root filesystem flavour. Only "debian" exists (scripts/distro/debian/).
A7S_DISTRO="${A7S_DISTRO:-debian}"

# Debian suite of the image.
A7S_SUITE="${A7S_SUITE:-trixie}"

# snapshot.debian.org timestamp the image's packages come from (YYYYMMDDTHHMMSSZ).
# A fixed timestamp makes the root filesystem reproducible. Empty: use the live
# archive (deb.debian.org, security.debian.org) instead; the image then carries
# whatever is current and is not reproducible.
A7S_SNAPSHOT="${A7S_SNAPSHOT:-20261002T000000Z}"

# 1: install the Xfce desktop (and build the patched xfwm4). 0: console image.
A7S_DESKTOP="${A7S_DESKTOP:-0}"

# File name of the raw image in the artefact directory. Empty:
# a7s-<distro>-<suite>-<minimal|desktop>.img
A7S_IMAGE_NAME="${A7S_IMAGE_NAME:-}"

# Size of the raw image in MiB. Empty: sized from the root filesystem.
A7S_IMAGE_SIZE_MB="${A7S_IMAGE_SIZE_MB:-}"

# Login user (no password: you set one at the first login) and host name.
A7S_USER="${A7S_USER:-a7s}"
A7S_HOSTNAME="${A7S_HOSTNAME:-a7s}"

# 1: rebuild the root filesystem even if a cached one matches all inputs.
A7S_ROOTFS_REBUILD="${A7S_ROOTFS_REBUILD:-0}"

# --- build behaviour --------------------------------------------------------

# Parallel jobs for compiles. Empty: the number of CPUs the container sees.
A7S_JOBS="${A7S_JOBS:-}"

# Base URL of a content-addressed download mirror, tried before the upstream
# URLs: a file with sha256 <h> is fetched from <mirror>/<h>. A copy of someone's
# cache/sha256/ directory served over HTTP is such a mirror. The pinned sha256
# decides either way; a mirror can make a build faster, never different.
A7S_DOWNLOAD_MIRROR="${A7S_DOWNLOAD_MIRROR:-}"

# Seconds one download attempt may take before it is abandoned (fetch_verified).
A7S_FETCH_MAX_TIME="${A7S_FETCH_MAX_TIME:-3600}"

# SOURCE_DATE_EPOCH for every stage. Empty: the commit time of HEAD (build.sh
# reads it on the host); without git metadata, the A7S_SNAPSHOT time.
A7S_SOURCE_DATE_EPOCH="${A7S_SOURCE_DATE_EPOCH:-}"

# Build identity stamped into the image. Empty: build.sh sets the HEAD commit id
# (with a -dirty suffix for a modified tree), or "unknown" without git.
A7S_BUILD_COMMIT="${A7S_BUILD_COMMIT:-}"

# --- derived values (not switches) ------------------------------------------

if [ -z "${A7S_IMAGE_NAME}" ]; then
  if [ "${A7S_DESKTOP}" = 1 ]; then
    A7S_IMAGE_NAME="a7s-${A7S_DISTRO}-${A7S_SUITE}-desktop.img"
  else
    A7S_IMAGE_NAME="a7s-${A7S_DISTRO}-${A7S_SUITE}-minimal.img"
  fi
fi
